[project]
name = "usoar-edm"
version = "0.1.0"
description = "Embedding-based disruption measure (EDM) across domains"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/usoar_edm"]

[dependency-groups]
dev = ["pre-commit", "pytest", "pytest-cov", "ruff", "snakemake"]

[tool.ruff]
line-length = 88
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=usoar_edm --cov-report=term-missing -q"
